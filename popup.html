<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio Damascus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      background: #fff7ef;
      color: #0c0701;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      user-select: none;
      font-size: 13px;
    }

    /* Header */
    .header {
      background: #891539;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      /* revesed */
      flex-direction: row-reverse;
    }

    .header-logo {
      height: 32px;
      width: auto;
      display: block;
      filter: brightness(0) invert(1);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .freq-badge {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.5px;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      /* color: rgba(255,255,255,0.8); */
      color: #a58e71;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    /* .settings-btn:hover { color: #fff; } */
    .settings-btn:hover { color: #891539; }
    .settings-btn svg { width: 16px; height: 16px; display: block; }

    /* Status bar */
    .status-bar {
      background: #f3ede4;
      border-bottom: 1px solid #e0d5c5;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c0b0a0;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.loading { background: #e09020; animation: blink 0.9s ease-in-out infinite; }
    .status-dot.live    { background: #891539; animation: blink 1.4s ease-in-out infinite; }
    .status-dot.error   { background: #c03020; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .status-text {
      font-size: 11px;
      color: #6a5a40;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-timer {
      font-size: 11px;
      color: #891539;
      font-weight: 600;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* Controls */
    .controls {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .play-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .play-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: #891539;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(137,21,57,0.3);
    }

    .play-btn:hover  { background: #a01a45; }
    .play-btn:active { transform: scale(0.95); }
    .play-btn.loading { background: #b07020; }
    .play-btn svg { width: 24px; height: 24px; display: block; }

    .info-block { flex: 1; }

    .info-label {
      font-size: 10px;
      color: #a58e71;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 13px;
      color: #0c0701;
      font-weight: 600;
    }

    .info-value.live {
      color: #891539;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #891539;
      animation: blink 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }

    /* Volume */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .vol-icon svg { width: 15px; height: 15px; display: block; fill: #a58e71; }

    input[type="range"] {
      -webkit-appearance: none;
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: #e0d5c5;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #891539;
      cursor: pointer;
    }

    .vol-value { font-size: 11px; color: #a58e71; width: 30px; }

    /* Log panel */
    .log-panel {
      display: none;
      border-top: 1px solid #e0d5c5;
      background: #0c0701;
      padding: 8px 10px;
      max-height: 120px;
      overflow-y: auto;
    }

    .log-panel.visible { display: block; }

    .log-line {
      font-size: 10px;
      color: #a58e71;
      font-family: monospace;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-line.error { color: #e05030; }
    .log-line.event { color: #4a9a50; }

    /* Settings panel */
    .settings-panel {
      display: none;
      border-top: 1px solid #e0d5c5;
      padding: 12px 16px;
      background: #f8f2e8;
    }

    .settings-panel.visible { display: block; }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #e8e0d0;
    }

    .settings-row:last-child { border-bottom: none; }

    .settings-label { font-size: 12px; color: #4a3a20; }

    .toggle {
      width: 36px;
      height: 20px;
      border-radius: 10px;
      background: #d0c5b5;
      border: none;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .toggle.on { background: #891539; }

    .toggle::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
    }

    .toggle.on::after { transform: translateX(16px); }

    .clear-btn {
      font-size: 11px;
      color: #891539;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .clear-btn:hover { background: #f0e0e0; }

    /* Footer */
    .footer {
      padding: 7px 16px 10px;
      border-top: 1px solid #e0d5c5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left { font-size: 10px; color: #c0b0a0; }

    .site-link {
      font-size: 10px;
      color: #c0b0a0;
      text-decoration: none;
      transition: color 0.2s;
    }

    .site-link:hover { color: #891539; }
  </style>
</head>

    <div class="live-timer" id="liveTimer"></div>
  </div>

      </span>
      <input type="range" id="volumeSlider" min="0" max="100" value="80" />
