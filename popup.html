<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio Damascus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Color tokens. Light values match the original hand-tuned palette
       exactly (zero visual change there); the dark block only kicks in
       when the OS/browser is in dark mode, via prefers-color-scheme -
       there's no in-app toggle, so this can't drift out of sync with a
       separate "theme" setting. */
    :root {
      --bg: #fff7ef;
      --fg: #0c0701;
      --brand: #891539;
      --brand-hover: #a01a45;
      --loading: #e09020;
      --error: #c03020;
      --accent-warm: #a58e71;
      --muted-border: #e0d5c5;
      --surface: #f3ede4;
      --surface-2: #f8f2e8;
      --surface-2-border: #e8e0d0;
      --status-idle: #c0b0a0;
      --status-text: #6a5a40;
      --settings-label: #4a3a20;
      --toggle-off: #d0c5b5;
      --log-bg: #0c0701;
      --log-fg: #a58e71;
      --log-error: #e05030;
      --log-event: #4a9a50;
      --clear-hover-bg: #f0e0e0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1410;
        --fg: #f5ece0;
        --brand: #a5285a;
        --brand-hover: #c23a70;
        --accent-warm: #c9a880;
        --muted-border: #3a2a20;
        --surface: #241a14;
        --surface-2: #2a1e17;
        --surface-2-border: #3a2a20;
        --status-idle: #6a5a4a;
        --status-text: #c9a880;
        --settings-label: #e8dcc8;
        --toggle-off: #4a3a2c;
        --clear-hover-bg: #3a1f22;
      }
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      user-select: none;
      font-size: 13px;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    /* Header */
    .header {
      background: var(--brand);
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      /* revesed */
      flex-direction: row-reverse;
    }

    .header-logo {
      height: 32px;
      width: auto;
      display: block;
      filter: brightness(0) invert(1);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .freq-badge {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.5px;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      /* color: rgba(255,255,255,0.8); */
      color: #a58e71;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    /* .settings-btn:hover { color: #fff; } */
    .settings-btn:hover { color: var(--brand); }
    .settings-btn svg { width: 16px; height: 16px; display: block; }

    /* Status bar */
    .status-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--muted-border);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--status-idle);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.loading { background: var(--loading); animation: blink 0.9s ease-in-out infinite; }
    .status-dot.live    { background: var(--brand); animation: blink 1.4s ease-in-out infinite; }
    .status-dot.error   { background: var(--error); }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* Standing banner for a real, fixable problem (the header rule that
       makes the stream accept the connection at all being disabled) -
       deliberately separate from the transient status-bar text, since this
       can be true whether or not playback happens to be running right now. */
    .dnr-warning {
      background: var(--error);
      color: #fff;
      font-size: 11px;
      line-height: 1.4;
      padding: 8px 14px;
    }

    .status-text {
      font-size: 11px;
      color: var(--status-text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-timer {
      font-size: 11px;
      color: var(--brand);
      font-weight: 600;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* Controls */
    .controls {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .play-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .play-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(137,21,57,0.3);
    }

    .play-btn:hover  { background: var(--brand-hover); }
    .play-btn:active { transform: scale(0.95); }
    .play-btn.loading { background: #b07020; }
    .play-btn svg { width: 24px; height: 24px; display: block; }

    .info-block { flex: 1; }

    .info-label {
      font-size: 10px;
      color: var(--accent-warm);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 13px;
      color: var(--fg);
      font-weight: 600;
    }

    .info-value.live {
      color: var(--brand);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand);
      animation: blink 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }

    /* Now-playing metadata - only shown when the stream actually sends an
       ID3 title for the current track. */
    .now-playing {
      display: none;
      font-size: 11px;
      color: var(--accent-warm);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Volume */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .vol-icon svg { width: 15px; height: 15px; display: block; fill: var(--accent-warm); }

    .vol-mute-btn {
      background: none;
      border: none;
      padding: 2px;
      cursor: pointer;
      display: flex;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .vol-mute-btn:hover { background: var(--surface); }
    .vol-mute-btn[aria-pressed="true"] svg { fill: var(--brand); }

    input[type="range"] {
      -webkit-appearance: none;
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: var(--muted-border);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--brand);
      cursor: pointer;
    }

    .vol-value { font-size: 11px; color: var(--accent-warm); width: 30px; }

    /* Log panel - a small toolbar (level filter + count) above a scrolling,
       column-aligned list. Each row is time / level badge / source / message
       instead of one flat string, so a warning or error jumps out instead of
       blending into routine chatter. */
    .log-toolbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid var(--muted-border);
      background: var(--log-bg);
      padding: 5px 10px;
    }

    .log-toolbar.visible { display: flex; }

    .log-level-filter {
      font-size: 10px;
      color: var(--log-fg);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 3px;
      padding: 2px 4px;
      cursor: pointer;
    }

    .log-count {
      font-size: 9px;
      color: rgba(255,255,255,0.35);
      font-family: monospace;
      white-space: nowrap;
    }

    .log-panel {
      display: none;
      background: var(--log-bg);
      padding: 4px 10px 8px;
      max-height: 140px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .log-panel.visible { display: block; }

    .log-empty {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      font-family: monospace;
      padding: 6px 0;
    }

    .log-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 10px;
      color: var(--log-fg);
      font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
      line-height: 1.6;
      padding: 1px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .log-line:last-child { border-bottom: none; }

    .log-time { flex-shrink: 0; color: rgba(255,255,255,0.35); }

    .log-badge {
      flex-shrink: 0;
      width: 28px;
      text-align: center;
      font-weight: 700;
      font-size: 9px;
      border-radius: 3px;
      padding: 0 1px;
      color: var(--log-fg);
      background: rgba(165,140,113,0.2);
    }

    .log-source {
      flex-shrink: 0;
      width: 44px;
      text-transform: uppercase;
      font-size: 9px;
      opacity: 0.55;
    }

    .log-msg {
      flex: 1;
      min-width: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-line.log-warn .log-badge { background: rgba(224,144,32,0.25); color: var(--loading); }
    .log-line.log-warn .log-msg   { color: var(--loading); }

    .log-line.log-error .log-badge { background: rgba(224,80,48,0.3); color: var(--log-error); }
    .log-line.log-error .log-msg   { color: var(--log-error); }

    /* Settings panel */
    .settings-panel {
      display: none;
      border-top: 1px solid var(--muted-border);
      padding: 12px 16px;
      background: var(--surface-2);
    }

    .settings-panel.visible { display: block; }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--surface-2-border);
      gap: 10px;
    }

    .settings-row:last-child { border-bottom: none; }

    .settings-label { font-size: 12px; color: var(--settings-label); }

    .sleep-select {
      font-size: 11px;
      color: var(--settings-label);
      background: var(--bg);
      border: 1px solid var(--muted-border);
      border-radius: 4px;
      padding: 3px 5px;
      cursor: pointer;
    }

    .sleep-remaining {
      font-size: 11px;
      color: var(--brand);
      font-weight: 600;
    }

    .toggle {
      width: 36px;
      height: 20px;
      border-radius: 10px;
      background: var(--toggle-off);
      border: none;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .toggle.on { background: var(--brand); }

    .toggle::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
    }

    .toggle.on::after { transform: translateX(16px); }

    .clear-btn {
      font-size: 11px;
      color: var(--brand);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .clear-btn:hover { background: var(--clear-hover-bg); }

    /* Footer */
    .footer {
      padding: 7px 16px 10px;
      border-top: 1px solid var(--muted-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left { font-size: 10px; color: var(--status-idle); }

    .site-link {
      font-size: 10px;
      color: var(--status-idle);
      text-decoration: none;
      transition: color 0.2s;
    }

    .site-link:hover { color: var(--brand); }
  </style>
</head>
<body>

    <img class="header-logo" id="logo" src="icons/logo.svg" alt="Radio Damascus" />

  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">Ready to play</div>
    <div class="live-timer" id="liveTimer"></div>
  </div>

  <div class="dnr-warning" id="dnrWarning" style="display:none" role="alert"></div>

  <div class="controls">
    <div class="play-row">
      <button class="play-btn" id="playBtn" aria-label="Play">
        <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
        <svg id="iconLoading" viewBox="0 0 24 24" fill="currentColor" style="display:none">
          <path d="M12 4V2A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8z">
            <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/>
          </path>
        </svg>
      </button>

      <div class="info-block">
        <div class="info-label">Status</div>
        <div class="info-value" id="infoValue">Stopped</div>
        <div class="now-playing" id="nowPlaying"></div>
      </div>
    </div>

    <div class="volume-row">
      <button class="vol-icon vol-mute-btn" id="muteBtn" aria-label="Mute" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
      <input type="range" id="volumeSlider" min="0" max="100" value="80" aria-label="Volume" />
      <span class="vol-value" id="volValue">80%</span>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-row">
      <span class="settings-label" id="sleepTimerLabel">Sleep timer</span>
      <select class="sleep-select" id="sleepTimerSelect" aria-labelledby="sleepTimerLabel">
        <option value="0">Off</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="45">45 min</option>
        <option value="60">60 min</option>
      </select>
    </div>
    <div class="settings-row" id="sleepTimerRemainingRow" style="display:none">
      <span class="settings-label">Stops playing in</span>
      <span class="sleep-remaining" id="sleepTimerRemaining">--:--</span>
    </div>
    <div class="settings-row">
      <span class="settings-label" id="resumeLabel">Resume on browser launch</span>
      <button class="toggle" id="resumeToggle" role="switch" aria-checked="false" aria-labelledby="resumeLabel"></button>
    </div>
    <div class="settings-row">
      <span class="settings-label">Keyboard shortcut</span>
      <button class="clear-btn" id="shortcutLink" aria-label="Open keyboard shortcut settings">Change</button>
    </div>
    <div class="settings-row">
      <span class="settings-label" id="logToggleLabel">Show debug log</span>
      <button class="toggle" id="logToggle" role="switch" aria-checked="false" aria-labelledby="logToggleLabel"></button>
    </div>
    <div class="settings-row">
      <span class="settings-label">Clear log</span>
      <button class="clear-btn" id="clearLog" aria-label="Clear debug log">Clear</button>
    </div>
    <div class="settings-row">
      <span class="settings-label">Copy diagnostics</span>
      <button class="clear-btn" id="copyDiagnostics" aria-label="Copy diagnostics to clipboard">Copy</button>
    </div>
    <div class="settings-row">
      <span class="settings-label">Total listening time</span>
      <span class="settings-label" id="totalListenLabel">0m</span>
    </div>
    <div class="settings-row">
      <span class="settings-label">Version</span>
      <span class="settings-label" id="versionLabel">3.1.0</span>
    </div>
  </div>

  <div class="log-toolbar" id="logToolbar">
    <select class="log-level-filter" id="logLevelFilter" aria-label="Filter log by level">
      <option value="all">All levels</option>
      <option value="info">Info</option>
      <option value="warn">Warn</option>
      <option value="error">Error</option>
    </select>
    <span class="log-count" id="logCount">0 entries</span>
  </div>
  <div class="log-panel" id="logPanel"></div>

  <div class="footer">
    <span class="footer-left">Radio Damascus - Syria</span>
    <!-- <a class="site-link" href="https://damasradio.fm" target="_blank">damasradio.fm</a> -->

      </svg>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
